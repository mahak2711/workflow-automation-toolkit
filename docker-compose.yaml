services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./agents:/app/agents

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: celery -A workers.celery_app worker -l info -c 4
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./agents:/app/agents

  beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: celery -A workers.celery_app beat -l info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./agents:/app/agents

volumes:
  redis_data:
